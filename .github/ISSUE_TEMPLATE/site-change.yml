name: サイトの修正・追加をお願いする
description: 文章、リンク、YouTube紹介、デザインなどのご要望
title: '[修正依頼] '
body:
  - type: markdown
    attributes:
      value: |
        日本語でお気軽にご記入ください。公開されるため、パスワード・APIキー・個人の連絡先は書かないでください。
        Issue登録だけでは自動修正は始まりません。対応するIssueをCodexに指定して、PRを作成します。
  - type: input
    id: page
    attributes:
      label: 修正したいページ・箇所
      placeholder: 例：ことばの案内帳の「WHITEBURN」／ページのURL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: どのように変更したいですか？
      placeholder: 今の内容と、変更後の文章やご希望を教えてください。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 参考URL・補足
      description: 公式の案内、動画、参考画像などがあれば添えてください。
  - type: dropdown
    id: language
    attributes:
      label: 関係する言語
      options:
        - すべての言語／わからない
        - 日本語
        - English
        - 简体中文
        - 繁體中文
